name: Check Apiserver Tags

on:
  schedule:
    # Daily at 14:00 UTC
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: check-apiserver-tags
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  S3_BUCKET: ${{ secrets.APISERVER_TAGS_S3_BUCKET }}
  SUPPORTED_MINORS: "0.8 0.9 0.10"

jobs:
  check-apiserver-tags:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Discover latest supported apiserver tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          git ls-remote --tags --refs \
            https://github.com/rancher/apiserver.git \
            'refs/tags/v*' |
            awk '{sub("refs/tags/", "", $2); print $2}' \
            > /tmp/apiserver-tags.txt

          python3 <<'PY'
          import os
          import re

          pattern = re.compile(
              r"^v(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$"
          )

          def parse(tag):
              match = pattern.fullmatch(tag)
              if not match:
                  return None
              major, minor, patch, prerelease = match.groups()
              return int(major), int(minor), int(patch), prerelease

          def compare(a, b):
              va, vb = parse(a), parse(b)

              if va[:3] != vb[:3]:
                  return (va[:3] > vb[:3]) - (va[:3] < vb[:3])

              pa, pb = va[3], vb[3]

              if pa is None or pb is None:
                  return (pa is None) - (pb is None)

              ia, ib = pa.split("."), pb.split(".")

              for x, y in zip(ia, ib):
                  if x == y:
                      continue

                  nx, ny = x.isdigit(), y.isdigit()

                  if nx and ny:
                      return (int(x) > int(y)) - (int(x) < int(y))
                  if nx != ny:
                      return -1 if nx else 1
                  return (x > y) - (x < y)

              return (len(ia) > len(ib)) - (len(ia) < len(ib))

          supported = set(os.environ["SUPPORTED_MINORS"].split())
          latest = {}

          with open("/tmp/apiserver-tags.txt") as source:
              for line in source:
                  tag = line.strip()
                  version = parse(tag)

                  if version is None:
                      continue

                  minor = f"{version[0]}.{version[1]}"
                  if minor not in supported:
                      continue

                  if (
                      minor not in latest
                      or compare(tag, latest[minor]) > 0
                  ):
                      latest[minor] = tag

          missing = supported - set(latest)
          if missing:
              raise SystemExit(
                  "No matching tags found for: " + ", ".join(sorted(missing))
              )

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("versions<<EOF", file=output)
              for minor in sorted(
                  latest, key=lambda x: tuple(map(int, x.split(".")))
              ):
                  print(f"{minor}={latest[minor]}", file=output)
              print("EOF", file=output)

          print("Latest supported apiserver tags:")
          for minor in sorted(
              latest, key=lambda x: tuple(map(int, x.split(".")))
          ):
              print(f"  {minor}: {latest[minor]}")
          PY

      - name: Compare S3 cache and dispatch integration tests
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONS: ${{ steps.tags.outputs.versions }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS='=' read -r minor latest_tag; do
            [[ -n "$minor" && -n "$latest_tag" ]] || continue

            key="${minor}.txt"
            cached_tag=""

            if aws s3api head-object \
                --bucket "$S3_BUCKET" \
                --key "$key" \
                >/dev/null 2>/tmp/s3-error; then

              aws s3 cp "s3://${S3_BUCKET}/${key}" \
                /tmp/cached-tag.txt --only-show-errors

              cached_tag="$(tr -d '\r\n' < /tmp/cached-tag.txt)"

            elif grep -Eqi \
                '404|Not Found|NoSuchKey' /tmp/s3-error; then
              echo "No cache for ${minor}; initializing it."
            else
              cat /tmp/s3-error
              echo "::error::Failed to check S3 object ${key}"
              exit 1
            fi

            echo "Apiserver ${minor}:"
            echo "  Cached: ${cached_tag:-<none>}"
            echo "  Latest: ${latest_tag}"

            if [[ "$cached_tag" == "$latest_tag" ]]; then
              echo "No change; skipping ${latest_tag}."
              continue
            fi

            echo "New apiserver version detected: ${latest_tag}"

            gh workflow run apiserver-tests-e2e.yml \
              --repo rancher/apiserver-tests \
              --ref main \
              --field "apiserver_version=${latest_tag}"

            printf '%s\n' "$latest_tag" > /tmp/cached-tag.txt

            aws s3 cp /tmp/cached-tag.txt \
              "s3://${S3_BUCKET}/${key}" \
              --content-type text/plain \
              --only-show-errors

            echo "Updated S3 cache: ${key} = ${latest_tag}"

          done <<< "$VERSIONS"