name: Apiserver Integration Tests

on:
  pull_request:
    branches:
      - diamond/apiserver-mvp
  workflow_dispatch:
    inputs:
      apiserver_version:
        description: "Apiserver version to test (with leading v)"
        required: true
        type: string
      qase_test_run_id:
        description: "Existing Qase test run ID (optional, will create a new run if not provided)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  apiserver-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout apiserver-tests
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set apiserver version in apiserver-tests go.mod
        env:
          # APISERVER_VERSION: "${{ inputs.apiserver_version }}"
          APISERVER_VERSION: "v0.8.8"
        run: |
          set -euo pipefail

          module="github.com/rancher/apiserver"

          if [[ ! "$APISERVER_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid apiserver version: $APISERVER_VERSION"
            exit 1
          fi

          echo "go.mod before:"
          grep -E "${module} " go.mod || true

          go get "${module}@${APISERVER_VERSION}"

          echo "go.mod after:"
          grep -E "${module} " go.mod || true

          actual="$(go list -m -f '{{.Version}}' "$module")"
          if [[ "$actual" != "$APISERVER_VERSION" ]]; then
            echo "::error::Expected $APISERVER_VERSION but resolved $actual"
            exit 1
          fi

          # Guard: only go.mod and go.sum may have changed.
          changed="$(git status --porcelain --untracked-files=no | grep -vE ' (go\.mod|go\.sum)$' || true)"
          if [ -n "$changed" ]; then
            echo "::error::Unexpected files changed:"
            echo "$changed"
            exit 1
          fi

          git diff --stat go.mod go.sum

      - name: Verify Go dependencies
        run: go mod download

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@c4a0df2e75a225d979a444342dd3db752b53619f

